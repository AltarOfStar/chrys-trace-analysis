[project]
name = "chrys-trace-analysis"
version = "0.1.0"
description = "Coding agent trajectory analysis — deviation detection, categorization, and turn-level analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
chrys-trace-analysis = "chrys_trace_analysis.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chrys_trace_analysis"]
